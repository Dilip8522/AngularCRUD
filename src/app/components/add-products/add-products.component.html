<div class="container mt-5">
    <div class="row">
        <div class="col-md-4">
            <form [formGroup]="productsForm" (ngSubmit)="addNew()">
                <h3>Add Product</h3>
                <div class="form-group mb-3">
                    <label>Product Id</label>
                    <input type="text" class="form-control" formControlName="id" placeholder="Enter Product Id"  name="ProductId">
                </div>
                <div class="form-group mb-3">
                    <label>Product Name</label>
                    <input type="text" class="form-control" formControlName="name" placeholder="Enter Product Name" name="ProductN">
                </div>
                <div class="form-group mb-3">
                    <label>Product Price</label>
                    <input type="text" class="form-control" formControlName="price" placeholder="Enter ProductPrice" name="ProductP">
                </div>
                <div class="form-group mb-3">
                    <label>Product Category</label>
                    <input type="text" class="form-control" formControlName="category" placeholder="Enter Product Category" name="ProductC">
                </div>
                <div class="form-group mb-3">
                    <label>Product Description</label>
                    <input type="text" class="form-control" formControlName="description" placeholder="Enter Product Description" name="ProductD">
                </div>
                <div class="form-group mb-3">
                    <label>Product Image</label>
                    <input type="text" class="form-control" formControlName="image" placeholder="Enter Product Image" name="ProductI">
                </div>
                <div class="form-group">
                    <button class="btn btn-success me-2" [disabled]="!productsForm.valid" type="submit">Add</button>
                    <button class="btn btn-primary" type="reset">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
